name: SHELF deploy (Cloudflare)

# Publishes SHELF at its own domain on Cloudflare (static files + the Worker
# in shelf/worker/). Runs after each daily update and on code changes. Until
# the CLOUDFLARE_* secrets and the SHELF_BASE_URL variable are set it only
# prints a notice, and GitHub Pages keeps serving the site.
on:
  workflow_run:
    workflows: ['SHELF update']
    types: [completed]
  push:
    paths: ['shelf/**', '.github/workflows/shelf-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shelf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check configuration
        id: cfg
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          BASE: ${{ vars.SHELF_BASE_URL }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ -z "$BASE" ]; then
            echo "::notice::Cloudflare deploy skipped: set secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and variable SHELF_BASE_URL."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Build for the edge
        if: steps.cfg.outputs.ready == 'true'
        env:
          SHELF_EDGE: '1'
          SHELF_BASE_URL: ${{ vars.SHELF_BASE_URL }}
          SHELF_OUT_DIR: ${{ runner.temp }}/out
        run: |
          node shelf/tool/build.mjs
          node shelf/tool/edge.mjs
      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.gen.json
      - name: Smoke test
        if: steps.cfg.outputs.ready == 'true'
        env:
          BASE: ${{ vars.SHELF_BASE_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$BASE/llms.txt" | head -1 | grep -q '^# SHELF' &&
               curl -fsS -X POST "$BASE/mcp" -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | grep -q '"name":"shelf"'; then
              echo "SHELF is live at $BASE"; exit 0
            fi
            sleep 20
          done
          echo "::error::$BASE did not answer after deploy (DNS for a new custom domain can take a few minutes)"
          exit 1
