name: SHELF CI

on:
  push:
    paths: ['shelf/**', '.github/workflows/shelf-*.yml']
  pull_request:
    paths: ['shelf/**', '.github/workflows/shelf-*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'shelf/tool/test/*.test.mjs'
      - name: Build and audit from sample data into a scratch directory
        env:
          SHELF_DATA_DIR: ${{ runner.temp }}/data
          SHELF_OUT_DIR: ${{ runner.temp }}/out
        run: |
          node shelf/tool/update.mjs
          node shelf/tool/check.mjs
      - name: Bundle the Cloudflare Worker (dry run, no credentials)
        env:
          SHELF_EDGE: '1'
          SHELF_BASE_URL: https://shelf.example.com
          SHELF_DATA_DIR: ${{ runner.temp }}/data
          SHELF_OUT_DIR: ${{ runner.temp }}/edge
        run: |
          node shelf/tool/build.mjs
          node shelf/tool/edge.mjs
          npx --yes wrangler@4 deploy --dry-run --config wrangler.gen.json --outdir "${{ runner.temp }}/bundle"
