name: Deploy to GitHub Pages

# The demo is a static site with no build step, so the repository root is
# published as-is.
on:
  push:
  workflow_dispatch:
  # The daily SHELF update commits with GITHUB_TOKEN, which does not fire
  # push; redeploy when it finishes instead.
  workflow_run:
    workflows: ['SHELF update']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch is published, whatever it is currently called.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Requires Settings -> Pages -> Source: "GitHub Actions" to have been
      # selected once; the workflow token cannot create the site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
